name: Genera audio lezioni

on:
  push:
    branches: [voce]

permissions:
  contents: write

jobs:
  audio:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installa strumenti
        run: pip install edge-tts imageio-ffmpeg
      - name: Genera
        run: python tools/gen_audio.py
      - name: Salva gli audio nel branch
        run: |
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git add app/src/main/assets/audio samples
          git commit -m "Audio lezioni generati" || echo "niente da salvare"
          git push origin HEAD:voce
