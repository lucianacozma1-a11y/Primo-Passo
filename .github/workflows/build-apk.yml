name: Compila APK

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/smoke.sh'
      - '.github/workflows/smoke-test.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Accetta licenze Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Compila
        run: gradle assembleDebug --stacktrace

      - name: Rinomina APK
        run: cp app/build/outputs/apk/debug/app-debug.apk PrimoPasso.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PrimoPasso-apk
          path: PrimoPasso.apk

      - name: Pubblica come Release (download diretto dal telefono)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Primo Passo 1.0.${{ github.run_number }}
          body: Scarica PrimoPasso.apk qui sotto e aprilo sul telefono per installarlo.
          files: PrimoPasso.apk
          make_latest: true
